services:
  event-service-gui:
    build: .
    image: ghcr.io/langrenn-sprint/event-service-gui:test
    # Only the container port: Docker picks a free port on the host, so the
    # tests do not collide with the deploy stack or another repo's tests.
    # conftest.py finds it with docker_services.port_for().
    ports:
      - 8080
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - HOST_PORT=8080
      - HOST_SERVER=event-service-gui
      - EVENTS_HOST_SERVER=event-service
      - EVENTS_HOST_PORT=8000
      - RACE_HOST_SERVER=race-service
      - RACE_HOST_PORT=8080
      - COMPETITION_FORMAT_HOST_SERVER=competition-format-service
      - COMPETITION_FORMAT_HOST_PORT=8000
      - USERS_HOST_SERVER=user-service
      - USERS_HOST_PORT=8000
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - ERROR_FILE=error.log
      - FERNET_KEY=${FERNET_KEY}
    volumes:
      - type: bind
        source: ./error.log
        target: /app/error.log
    depends_on:
      - "event-service"
      - "competition-format-service"
      - "race-service"
      - "user-service"
      - "mongodb"
  event-service:
    image: ghcr.io/langrenn-sprint/event-service:latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COMPETITION_FORMAT_HOST_SERVER=competition-format-service
      - COMPETITION_FORMAT_HOST_PORT=8000
      - USERS_HOST_SERVER=user-service
      - USERS_HOST_PORT=8000
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - "mongodb"
  race-service:
    image: ghcr.io/langrenn-sprint/race-service:latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COMPETITION_FORMAT_HOST_SERVER=competition-format-service
      - COMPETITION_FORMAT_HOST_PORT=8000
      - EVENTS_HOST_SERVER=event-service
      - EVENTS_HOST_PORT=8000
      - USERS_HOST_SERVER=user-service
      - USERS_HOST_PORT=8000
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - "mongodb"
  competition-format-service:
    image: ghcr.io/langrenn-sprint/competition-format-service:latest
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - USERS_HOST_SERVER=user-service
      - USERS_HOST_PORT=8080
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-service
      - mongodb
  user-service:
    image: ghcr.io/langrenn-sprint/user-service:latest
    environment:
      - JWT_EXP_DELTA_SECONDS=${JWT_EXP_DELTA_SECONDS}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - "mongodb"
  mongodb:
    image: mongo:8.0-noble
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
